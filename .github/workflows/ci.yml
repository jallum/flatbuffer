name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-test:
    name: unit test
    runs-on: ubuntu-24.04
    env:
      FORCE_COLOR: 1
      MIX_ENV: test
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Loose versions resolve to the latest matching patch release —
          # exact pins rot (OTP 27.1's ssl rejects hex.pm's current certs).
          # Oldest supported toolchain (mix.exs requires ~> 1.18)
          - elixir: "1.18"
            otp: "27.3"
          # Matches local development
          - elixir: "1.19"
            otp: "28.3"
          # Newest toolchain; the lint cell runs the version-independent
          # checks once.
          # Exactly one cell reports coverage: coveralls closes a PR's
          # build on the first non-parallel upload, so a second reporting
          # cell would 422 whenever finish times diverge.
          - elixir: "1.20"
            otp: "29.0"
            lint: lint
            coverage: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Restore deps and _build cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-
      - name: Install dependencies
        run: mix deps.get
      - name: Compile deps
        run: mix deps.compile
      - name: Check unused dependencies
        run: mix deps.unlock --check-unused
        if: ${{ matrix.lint }}
      - name: Compile
        run: mix compile --warnings-as-errors
      - name: Run tests
        run: ${{ matrix.coverage && 'mix coveralls.github --warnings-as-errors' || 'mix test --warnings-as-errors' }}
      - name: Install flatc integration dependencies
        if: ${{ matrix.lint }}
        run: sudo apt-get update && sudo apt-get install --yes flatbuffers-compiler libflatbuffers-dev g++
      - name: Run flatc integration tests
        if: ${{ matrix.lint }}
        run: mix test --only flatc
